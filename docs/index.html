<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar de Vagas · OH Tech</title>
  <meta name="description" content="Vagas abertas de front-end, full-stack e back-end, atualizadas todo dia, com adaptador de CV por IA. Um projeto OH Tech.">
  <meta name="theme-color" content="#0a0f1d">
  <link rel="icon" type="image/png" href="oh-tech-icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="topo-site">
    <div class="topo-dentro">
      <a class="marca" href="./" aria-label="OH Tech Technology — Radar de Vagas">
        <img src="oh-tech-logo.png" alt="OH Tech Technology" width="600" height="171">
      </a>
      <div class="meta-curta" id="meta-curta" title="Candidaturas marcadas nesta semana">
        <span class="meta-texto"><strong id="meta-feitas">0</strong> de <span id="meta-total">5</span> candidaturas nesta semana</span>
        <span class="meta-barra" aria-hidden="true"><span id="meta-fill"></span></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="busca-area">
      <h1>Encontre sua próxima vaga</h1>
      <p class="sub" id="rodada">Carregando vagas…</p>

      <label class="busca">
        <span class="sr">Buscar vagas</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" placeholder="Busque por tecnologia ou empresa. Ex.: React, Java, Nubank" autocomplete="off">
      </label>

      <div class="filtros">
        <div class="abas" role="group" aria-label="Área">
          <button class="aba" data-v="todos" aria-pressed="true">Todas</button>
          <button class="aba" data-v="Front-end" aria-pressed="false">Front-end</button>
          <button class="aba" data-v="Full-stack" aria-pressed="false">Full-stack</button>
          <button class="aba" data-v="Back-end" aria-pressed="false">Back-end</button>
        </div>
        <label class="seletor">Nível
          <select id="f-nivel">
            <option value="todos">Todos</option>
            <option value="Júnior">Júnior</option>
            <option value="Pleno">Pleno</option>
            <option value="Sênior">Sênior</option>
          </select>
        </label>
        <label class="seletor">Contrato
          <select id="f-regime">
            <option value="todos">Todos</option>
            <option value="PJ">PJ</option>
            <option value="CLT">CLT</option>
          </select>
        </label>
        <label class="marcar"><input type="checkbox" id="f-remoto"> Só 100% remoto</label>
        <label class="marcar"><input type="checkbox" id="f-ocultar"> Esconder as que já me candidatei</label>
      </div>
    </section>

    <aside class="dica" id="dica" aria-live="polite">
      <span class="dica-icone" aria-hidden="true">💡</span>
      <p id="dica-texto"></p>
      <button type="button" class="dica-botao" id="dica-proxima">Outra dica</button>
      <button type="button" class="dica-fechar" id="dica-fechar" aria-label="Esconder dicas">×</button>
    </aside>

    <div class="resultado">
      <p class="contagem" id="contagem"></p>
      <button type="button" class="limpar" id="limpar" hidden>Limpar filtros</button>
    </div>

    <ul class="lista" id="lista"></ul>

    <details class="fechadas" id="fechadas" hidden>
      <summary id="fechadas-resumo"></summary>
      <ul class="lista" id="lista-fechadas"></ul>
    </details>

    <footer class="rodape">
      <img src="oh-tech-icone.png" alt="" width="24" height="24">
      <span>Radar de Vagas · <strong>OH Tech Technology</strong> · Vagas do GitHub
      (<a href="https://github.com/frontendbr/vagas" target="_blank" rel="noopener">frontendbr</a>,
      <a href="https://github.com/backend-br/vagas" target="_blank" rel="noopener">backend-br</a>,
      <a href="https://github.com/react-brasil/vagas" target="_blank" rel="noopener">react-brasil</a>) e da Gupy, atualizadas todo dia às 7:15.</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="cv" id="cv" aria-labelledby="cv-vaga">
    <div class="cv-interno">
      <div class="cv-cab">
        <div>
          <div class="eyebrow">Adaptar CV com IA</div>
          <h2 id="cv-vaga"></h2>
          <div class="empresa" id="cv-empresa"></div>
        </div>
        <button class="cv-x" id="cv-fechar" type="button" aria-label="Fechar">×</button>
      </div>
      <div id="cv-corpo"></div>
    </div>
  </dialog>
  <div id="impressao"></div>

  <script src="app.js?v=8"></script>
  <script src="cv.js?v=8"></script>
</body>
</html>
