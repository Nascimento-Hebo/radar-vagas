name: Buscar vagas

on:
  schedule:
    # 10:15 UTC = 7:15 em Brasília, todos os dias
    - cron: "15 10 * * *"
  workflow_dispatch: # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: buscar-vagas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      TEM_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Testar a lógica
        run: npm test

      - name: Buscar vagas
        id: busca
        run: npm run buscar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar resultado no repositório
        run: |
          git config user.name "radar-vagas[bot]"
          git config user.email "radar-vagas@users.noreply.github.com"
          git add docs/vagas.json docs/novas.md docs/historico.json
          if git diff --cached --quiet; then
            echo "Nada mudou hoje."
          else
            git commit -m "Vagas de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi

      # Alerta diário: e-mail e notificação para quem ativou, só com as vagas novas que combinam com o que a pessoa procura.
      - name: Alertas de vagas (e-mail e notificação)
        if: ${{ env.TEM_FIREBASE == 'true' }}
        run: |
          npm install --no-save --no-audit --no-fund nodemailer@10.0.16 web-push@3.6.7
          node scripts/alertas.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      # Se alguma fonte não respondeu, a execução fica vermelha e o GitHub avisa o dono do repositório por e-mail.
      # As vagas das outras fontes já foram salvas no passo anterior.
      - name: Avisar se alguma fonte falhou
        if: ${{ steps.busca.outputs.alerta != '' }}
        run: |
          echo "::error title=Fonte de vagas com problema::${{ steps.busca.outputs.alerta }}"
          exit 1
